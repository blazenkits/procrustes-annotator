[project]
name = "procrustes-annotator"
version = "0.1.0"
description = "Interactive RGB-D correspondence annotation and Procrustes pose solving"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "Pillow>=10.0",
    "PySide6>=6.8",
    "pyvista>=0.48",
    "pyvistaqt>=0.11",
    "opencv-python",
    "open3d"

]

[project.optional-dependencies]
segmentation = [
    "huggingface-hub>=0.29",
    "sam-2 @ git+https://github.com/facebookresearch/sam2.git",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
]

[project.scripts]
procrustes-annotator = "src.frontend.main:main"
procrustes-icp-viewer = "src.tools.icp_viewer:main"
procrustes-silhouette-viewer = "src.tools.silhouette_sweep_viewer:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
